name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run export:web

  backend-unit-and-security:
    runs-on: ubuntu-latest
    env:
      AMPARAI_TEST_MODE: "1"
      FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
      GOOGLE_CLOUD_PROJECT: demo-amparai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: PYTHONPATH=backend python -m pytest backend/tests_unit -q
      - run: python scripts/security_checks.py
      - run: docker build --tag amparai-backend:ci backend

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-amparai
          "bash scripts/run_backend_integration.sh"
